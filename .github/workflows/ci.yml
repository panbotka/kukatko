name: CI

# One workflow, one run of the gate per commit, and the container image is
# published from that very run:
#   - push to main         -> gate, then the image's `latest` + sha tags
#   - push of a vX.Y.Z tag -> gate, then the semver tags {{version}} and {{major}}.{{minor}}
#   - pull_request to main -> gate, then build the image only (validates the Dockerfile)
# The image used to come from a separate workflow that re-ran the tests on its
# own: two independent runs of one suite per commit, so a single timing flake
# could pass the merge gate and still fail the publication — leaving main (or a
# release tag) without an image although its CI was green. Now `publish` needs
# `check` and `integration`, so the image ships exactly when the gate is green.
on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  GOLANGCI_LINT_VERSION: "v2.11.4"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Full quality gate: docs budget + formatting check + golangci-lint + frontend
  # ESLint/Prettier/tsc + Go and Vitest unit tests. This is the project's `make check`.
  # `make check` deliberately runs the Go tests without the race detector (see the
  # Makefile), so CI runs `make test-race` as a separate step on top of it.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run quality gate (make check)
        run: make check

      - name: Run Go unit tests under the race detector
        run: make test-race

  # Integration tests (DB/HTTP) against a real ephemeral Postgres + pgvector.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kukatko
          POSTGRES_PASSWORD: kukatko
          POSTGRES_DB: kukatko_test
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before the job runs.
        options: >-
          --health-cmd "pg_isready -U kukatko -d kukatko_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Ephemeral CI database — safe to truncate. No secrets here.
      KUKATKO_TEST_DATABASE_URL: postgres://kukatko:kukatko@localhost:5432/kukatko_test?sslmode=disable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install media tooling (ffmpeg + exiftool)
        # ffmpeg/ffprobe drive the video ingest (metadata probe + poster frame);
        # exiftool is the metadata fallback and the RAW/HEIC pipeline.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl

      - name: Create required Postgres extensions
        # Migrations also CREATE EXTENSION IF NOT EXISTS, but provision them up
        # front so the test DB is ready independent of migration ordering.
        run: |
          PGPASSWORD=kukatko psql -h localhost -U kukatko -d kukatko_test \
            -c 'CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS unaccent;'

      - name: Run integration tests
        run: make test-integration

  # Build the container image and push it to the GitHub Container Registry,
  # only once both gate jobs above are green for this same run.
  publish:
    needs: [check, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log into ${{ env.REGISTRY }}
        # PRs from forks cannot receive a write token, and PR builds never push,
        # so skip the login entirely on pull_request events.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=false disables the action's automatic `latest` on tag pushes;
          # we drive `latest` ourselves so it lands ONLY on the default branch.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Compute build args
        id: buildargs
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Semver build: the tag without its leading "v" (v1.2.3 -> 1.2.3).
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            # Branch/PR build: not a release, so stamp the placeholder version.
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Push on branch/tag events; on pull_request build only (validation).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.buildargs.outputs.version }}
            COMMIT_SHA=${{ steps.buildargs.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
